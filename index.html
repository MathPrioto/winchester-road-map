<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winchester Road Map — Unofficial Fan Project</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Winchester Road Map</h1>
    <nav>
      <button id="tab-map" class="active">Map</button>
      <button id="tab-info">Unconfirmed locations</button>
    </nav>
    <label id="season-label">Season
      <select id="season-filter"><option value="all">All</option></select>
    </label>
  </header>
  <div id="map"></div>
  <section id="info" hidden></section>
  <footer>Unofficial fan project. Not affiliated with or endorsed by Warner Bros. Dashed markers = fictional/approximate locations. <a href="credits.html" style="color:#e67e22">Credits</a></footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
